# Logging
CONFIG_LOG=y

# Button and LED support
CONFIG_DK_LIBRARY=y

# Newlib
CONFIG_NEWLIB_LIBC=y

# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# Memory
CONFIG_HEAP_MEM_POOL_SIZE=19000
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# Modem library
# Enable the nRF Modem library
CONFIG_NRF_MODEM_LIB=y

# Enable the LTE link controller library
CONFIG_LTE_LINK_CONTROL=y

# AT Host library 
CONFIG_AT_HOST_LIBRARY=y

# Enables interrupt support for UART, that the AT Host library can print asynchronously to the console.
CONFIG_UART_INTERRUPT_DRIVEN=y

# Enable this 2 enable printing floating-point numbers to console.
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_FPU=y

#----------------------------------- CoAP ---------------------------------------------------------------
# Enable the CoAP library
CONFIG_COAP=y

# Configure the CoAP server hostname
CONFIG_COAP_SERVER_HOSTNAME="188.149.134.45" #publika hemma

# Configure the CoAP server port
CONFIG_COAP_SERVER_PORT=5683

# Enable the modem’s network mode for GPS --------------------------------------------------------------------------- 
CONFIG_LTE_NETWORK_MODE_LTE_M_GPS=y

# Enable eDRX and PSM
CONFIG_LTE_LC_EDRX_MODULE=y
CONFIG_LTE_LC_PSM_MODULE=y

# enable requesitng the use of eDRX
CONFIG_LTE_EDRX_REQ=y

# Requesting periodic TAU of 8 hours and an active time of 16 seconds.
CONFIG_LTE_PSM_REQ_RPTAU="00101000"
CONFIG_LTE_PSM_REQ_RAT="00001000"

# Enable NRF cloud
CONFIG_NRF_CLOUD=y
CONFIG_NRF_CLOUD_AGNSS=y
CONFIG_NRF_CLOUD_COAP=y

# Required by nRF Cloud A-GNSS
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=y
CONFIG_MODEM_INFO_ADD_DEVICE=y

# Required for nRF Cloud CoAP authentication/JWT
CONFIG_MODEM_JWT=y
CONFIG_MODEM_KEY_MGMT=y
CONFIG_NRF_CLOUD_CLIENT_ID_SRC_INTERNAL_UUID=y
CONFIG_NRF_CLOUD_CHECK_CREDENTIALS=y
CONFIG_NRF_CLOUD_SEC_TAG=16842753

# Time for JWT / nRF Cloud
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_NTP=y

# CoAP client settings for nRF Cloud CoAP
CONFIG_COAP_CLIENT_BLOCK_SIZE=1024
CONFIG_COAP_CLIENT_STACK_SIZE=6144
CONFIG_COAP_CLIENT_THREAD_PRIORITY=0
CONFIG_COAP_EXTENDED_OPTIONS_LEN_VALUE=40

CONFIG_COAP_DEVICE_ID=200001
CONFIG_ADC=y

# Aktivera PDN-biblioteket och tillåt äldre PCO-hantering för ditt Conexa-SIM
CONFIG_PDN=y
CONFIG_PDN_LEGACY_PCO=y

# Gör att modemet skickar detaljerade felhändelser (som EMM-koder) till din C-kod
CONFIG_LTE_LC_MODEM_EVENTS_MODULE=y

# Tvinga modemet att använda ditt SIM-korts specifika APN vid registrering
CONFIG_PDN_DEFAULTS_OVERRIDE=y
CONFIG_PDN_DEFAULT_APN="eapn1.net"

# Aktivera nätverks- och bandkonfiguration
CONFIG_LTE_LINK_CONTROL=y

# Korrekt binär bit-sträng för Band 3, 8 och 20 (räknat från höger till vänster)
CONFIG_LTE_LOCK_BANDS=y
CONFIG_LTE_LOCK_BAND_MASK="10000000000010000100"